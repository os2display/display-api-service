# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # imagick allocates outside PHP's memory_limit, bounded by ImageMagick's own
    # resource limits. See "Hosting requirements" in README.md.
    driver: 'imagick'

    resolvers:
        default:
            web_path: ~

    filter_sets:
        cache: ~

        thumbnail:
            quality: 75
            filters:
                scale:
                    # Max 400 width, 400 height.
                    dim: [400, 400]

        # Scaled variants for screens, see MediaProvider::SCREEN_VARIANT_SIZES.
        # Fit the long edge, never upscale, keep the source format.
        screen_1920:
            quality: 85
            # Without it Imagine derives zlib level 1 from quality for PNG.
            png_compression_level: 9
            filters:
                downscale:
                    max: [1920, 1920]

        screen_3840:
            quality: 85
            png_compression_level: 9
            filters:
                downscale:
                    max: [3840, 3840]

        screen_7680:
            quality: 85
            png_compression_level: 9
            filters:
                downscale:
                    max: [7680, 7680]
