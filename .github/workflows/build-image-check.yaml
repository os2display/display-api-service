### ### Build image check
###
### Builds the API image for every published platform (`linux/amd64`,
### `linux/arm64`) on pull requests that change the image build, without
### pushing, and checks that ImageMagick works in it. Each platform builds on a
### native runner, so nothing is emulated. The publishing workflow
### (`build-images.yml`) only runs on push to `develop` and on tags.
###
### #### Assumptions
###
### 1. The image builds from `infrastructure/display-api-service/Dockerfile`
###    with the repository root as the `repository-root` build context.

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".dockerignore"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/build-image-check.yaml"

name: Build image check

jobs:
  build-api-image:
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `platforms` in build-images.yml.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build API image (${{ matrix.platform }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (API)
        uses: docker/build-push-action@v7
        with:
          context: ./infrastructure/display-api-service/
          file: ./infrastructure/display-api-service/Dockerfile
          build-contexts: |
            repository-root=.
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: display-api-service:check
          cache-from: type=gha,scope=display-api-service

      - name: Check ImageMagick
        run: |
          docker run --rm --entrypoint php display-api-service:check -d memory_limit=128M -r '
            $formats = Imagick::queryFormats();
            foreach (["JPEG", "PNG", "GIF"] as $format) {
                in_array($format, $formats, true) || exit("Missing ImageMagick format: $format\n");
            }
            $image = new Imagick();
            $image->newImage(8660, 5770, "white");
            $image->setImageFormat("jpeg");
            $image->thumbnailImage(400, 400, true);
            try {
                (new Imagick())->readImage("text:/etc/passwd");
                exit("ImageMagick read text:/etc/passwd; the security policy is not applied\n");
            } catch (ImagickException $e) {
                str_contains($e->getMessage(), "security policy") || exit("Unexpected error: " . $e->getMessage() . "\n");
                echo "Policy: ", $e->getMessage(), PHP_EOL;
            }
            echo Imagick::getVersion()["versionString"], PHP_EOL;
            echo "Memory limit: ", Imagick::getResourceLimit(Imagick::RESOURCETYPE_MEMORY), PHP_EOL;
            echo "Thumbnail: ", $image->getImageWidth(), "x", $image->getImageHeight(), PHP_EOL;
          '
