on:
  push:
    tags:
      - '*.*.*'

name: Create Github Release

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ALLOW_SUPERUSER: 1
      APP_ENV: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Composer install
        run: |
          docker network create frontend
          docker compose run --rm --user=root --env APP_ENV=prod phpfpm composer install --no-dev -o --classmap-authoritative
          docker compose run --rm --user=root --env APP_ENV=prod phpfpm composer clear-cache
          rm -rf infrastructure

      - name: Make assets dir
        run: |
          mkdir -p ../assets

      # The archive name is hard-coded rather than taken from the repository name,
      # so 2.x release assets keep the display-api-service name after the repo rename.
      - name: Create archive
        run: |
          tar \
            -zcf ../assets/display-api-service-${{ github.ref_name }}.tar.gz ./*

      - name: Create checksum
        run: sha256sum ../assets/display-api-service-${{ github.ref_name }}.tar.gz > ../assets/checksum.txt

      - name: Create a release in GitHub and uploads assets
        run: |
          # --latest=false: this is a maintenance line, not the newest release.
          # Without it `gh release create` flags every release it makes as the
          # repository's Latest, which would move that badge off 3.x.
          gh release create ${{ github.ref_name }} --verify-tag --generate-notes --latest=false ../assets/*.*
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash
